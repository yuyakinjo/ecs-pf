name: Publish Package to npm

# リリースが作成されたときに実行
on:
  release:
    types: [published]

# npm publish に必要な権限
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # コードをチェックアウト
      - name: Checkout
        uses: actions/checkout@v7

      # Bun環境のセットアップ
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      # Node.js環境のセットアップ (npm publish用)
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # 依存関係のインストール
      - name: Install dependencies
        run: bun install

      # TypeScriptの型チェック
      - name: TypeScript type check
        run: bun run type-check

      # oxlint / oxfmt でコード品質チェック
      - name: Code quality check
        run: bun run ci

      # テスト実行
      - name: Run tests
        env:
          AWS_REGION: us-east-1
          CI: true
        run: bun run test

      # プロジェクトのビルド
      - name: Build project
        run: bun run build

            # ビルド結果の確認
      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Build failed: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build successful: dist/index.js exists"

      # npmに公開（Provenance + Trusted Publishing）
      - name: Publish to npm with Provenance and Trusted Publishing
        run: npm publish --provenance --access public
        # 🔐 Trusted Publishing使用（トークン不要）