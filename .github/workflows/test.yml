name: Tests and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest

    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    strategy:
      matrix:
        bun-version: [1.3.2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install

      - name: Run TypeScript type check
        run: bun run type-check

      - name: Build project
        run: bun run build

      - name: Run tests with coverage
        env:
          # CI環境でのAWS認証エラーを回避するための環境変数
          AWS_REGION: us-east-1
          CI: true
        run: bun run test:coverage

      - name: Upload coverage to artifacts
        if: matrix.bun-version == '1.3.2'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 30

  test-e2e:
    name: End-to-End CLI Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Test CLI help commands
        run: |
          bun dist/index.js --help
          bun dist/index.js connect --help
          bun dist/index.js exec --help
          bun dist/index.js enable-exec --help

      - name: Test CLI version
        run: bun dist/index.js --version

      - name: Test CLI error handling
        run: |
          # テスト: 無効なコマンド
          if bun dist/index.js invalid-command 2>/dev/null; then
            echo "Error: Should fail with invalid command"
            exit 1
          else
            echo "✅ Correctly failed with invalid command"
          fi

          # テスト: 無効なオプション
          if bun dist/index.js connect --invalid-option 2>/dev/null; then
            echo "Error: Should fail with invalid option"
            exit 1
          else
            echo "✅ Correctly failed with invalid option"
          fi

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, test-e2e]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.test-e2e.result }}" == "success" ]]; then
            echo "✅ All tests passed! Quality gate: PASSED"
          else
            echo "❌ Some tests failed. Quality gate: FAILED"
            echo "Unit/Integration tests: ${{ needs.test.result }}"
            echo "E2E tests: ${{ needs.test-e2e.result }}"
            exit 1
          fi

      - name: Quality summary
        run: |
          echo "## 🎯 Quality Gate Summary"
          echo "- Unit Tests: ${{ needs.test.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "- Integration Tests: ${{ needs.test.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "- E2E Tests: ${{ needs.test-e2e.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"