name: release

# バージョンは日付から決めるので、タグは引き金ではなく**結果**。
# 出したいときに Actions から手で実行する
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: publish せず、決まるバージョンとリリースノートだけ確認する
        type: boolean
        default: false

# 同時に 2 本走ると同じ分の番号で衝突する
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # バージョンのコミットとタグを push し、Release を作る
      id-token: write # npm の Trusted Publishing (OIDC) に必要
    steps:
      - uses: actions/checkout@v7
        with:
          # リリースノートは「直前のタグから今回まで」を git log で読む
          # (scripts/release-notes.ts)。既定の浅い clone ではタグも履歴も
          # 無いので、本文が直近 1 件しか出ない
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      # provenance を付けるために npm CLI を使う (ビルドとテストは bun)
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      # 時刻から決める (CalVer YYYY.MMdd.HHmm、UTC)。何も調べなくてよい
      - name: decide the version
        id: version
        run: |
          version="$(bun run --silent version:next)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      # package.json だけ書き換える。src/version.ts は次の build が作り直す
      - name: write the version
        run: bun scripts/next-version.ts --write

      - run: bun run ci

      # type-check → build → bun test。dist/ もここで出来る
      - run: bun run test
        env:
          AWS_REGION: us-east-1
          CI: true

      # 焼き込まれた版が一致するか見る。src/version.ts は生成物なので、
      # ずれたまま publish できてしまう余地を消しておく
      - name: check what will be published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f dist/index.js
          bun dist/index.js --version | grep -Fqx "ecs-pf $VERSION"

      # CalVer の番号は互換性を伝えられないので、本文で知らせる
      - name: write the release notes
        run: |
          bun scripts/release-notes.ts "${{ steps.version.outputs.version }}" \
            > "$RUNNER_TEMP/notes.md"
          {
            echo "## ${{ steps.version.outputs.version }}"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: stop here on a dry run
        if: inputs.dry-run
        run: |
          echo "would publish ${{ steps.version.outputs.version }}" >&2
          cat "$RUNNER_TEMP/notes.md" >&2

      # Trusted Publishing (OIDC) を使うので NPM_TOKEN は要らない。
      # npm 側の trusted publisher はこのファイル名で登録してある
      - name: publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public

      # 公開が通ってから記録する。逆順だと、公開できていないのに
      # バージョンだけ進んだ履歴が残る
      - name: record the release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.ts
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags
          gh release create "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
